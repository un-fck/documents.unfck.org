name: Nightly Incremental Sync

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: # manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run incremental harvest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python python/harvest_incremental.py

      # Full-text pipeline runs in the SAME job, right after the harvest, so
      # digitallibrary.documents is fresh. The archive root is runner-temp
      # (ephemeral): files fetched tonight are gated here and now; the DB is
      # authoritative. Bring the SSD archive up to date locally afterwards with
      # `fulltext_fetch.py --sync-archive`. A blocked conversion or a failed
      # acceptance gate makes this step exit non-zero -> the workflow fails ->
      # email. See docs/fulltexts.md -> Nightly automation.
      - name: Run fulltext pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FULLTEXT_ARCHIVE_ROOT: ${{ runner.temp }}/fulltext-archive
        run: uv run python python/fulltext_nightly.py

      - name: Publish fulltext run manifests and rejected parses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-nightly-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            ${{ runner.temp }}/fulltext-archive/run_manifests
            ${{ runner.temp }}/fulltext-archive/parsed_dev/_failed
